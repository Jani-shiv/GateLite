version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatelite-postgres
    environment:
      POSTGRES_USER: gatelite
      POSTGRES_PASSWORD: gatelite
      POSTGRES_DB: gatelite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatelite -d gatelite"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gatelite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: gatelite-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gatelite
      MINIO_ROOT_PASSWORD: gatelite123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: gatelite-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: gatelite-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gatelite:gatelite@postgres:5432/gatelite
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      OTP_PROVIDER: mock
      PASS_SIGNING_KEY: dev-signing-key-change-in-production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gatelite-dev
      S3_ACCESS_KEY: gatelite
      S3_SECRET_KEY: gatelite123
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../apps/api:/app
      - /app/node_modules

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
    container_name: gatelite-admin
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ../../apps/admin:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data: